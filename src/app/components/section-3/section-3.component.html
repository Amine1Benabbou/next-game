<div class="py-10" style="background-color: #0e0e0e94">
  <div
    class="max-w-[90%] mx-auto rounded-4xl shadow-xl px-6 py-4 bg-gradient-to-b from-[#161616] via-[#161616] to-[#151515]"
  >
    <h2
      class="text-3xl font-extrabold text-center text-white mb-2 drop-shadow-md tracking-tight"
    >
      {{ fixedPathTranslate + "TITLE" | translate }}
    </h2>
    <p class="text-center text-gray-300 mb-7 font-medium">
      {{ fixedPathTranslate + "SUBTITLE" | translate }}
    </p>
    <form
      #tombolaForm="ngForm"
      (ngSubmit)="onSubmit()"
      class="flex flex-col items-center gap-5 w-full"
    >
      <input
        type="email"
        name="email"
        [(ngModel)]="email"
        required
        class="w-full px-5 py-3 rounded-full border border-gray-700 focus:border-primary focus:ring-2 focus:ring-primary/70 outline-none text-white bg-black/50 placeholder-gray-400 transition duration-200 shadow-inner"
        placeholder="{{ fixedPathTranslate + 'PLACEHOLDER' | translate }}"
        aria-label="Adresse e-mail"
        autocomplete="email"
      />
      <button
        type="submit"
        class="w-max rounded-full px-5 bg-gradient-to-r from-gray-950 to-gray-800 text-white py-2.5 font-semibold shadow-md mt-1 transition-all duration-200 hover:from-gray-800 hover:to-gray-950 focus:ring-4 focus:ring-primary/40 disabled:bg-gray-600 disabled:opacity-60"
      >
        <span class="text-white">{{
          submitted ? "Merci !" : (fixedPathTranslate + "BUTTON_1" | translate)
        }}</span>
      </button>
      <div
        *ngIf="error"
        class="text-red-400 text-center text-base mt-1 animate-pulse"
      >
        {{ fixedPathTranslate + "ERRORS." + error | translate }}
      </div>
      <div
        *ngIf="submitted"
        class="text-green-400 text-center text-sm mt-2 animate-fade-in"
      >
        {{ fixedPathTranslate + "SUCCESS_MESSAGE" | translate }}
      </div>
    </form>
  </div>
</div>
