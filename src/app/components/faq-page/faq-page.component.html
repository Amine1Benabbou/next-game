<div
  class="auth-bg-auth p-3 flex items-center justify-center flex-col gap-2 min-w-full min-h-full min-w-screen"
>
  <div
    class="container-form w-full max-w-[90%] max-md:min-w-full max-md:px-2 mx-auto bg-black/70 shadow-xl inset-shadow-sm rounded-3xl pb-8 px-8 max-sm:px-0 flex flex-col items-center relative form-annimation space-y-4"
  >
    <!-- Titre FAQ -->
    <div class="bg-white/10 rounded-full p-2 px-6 mt-3 flex items-center gap-2 ">
      <svg
        class="h-10 w-10"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 14 14"
      >
        <circle
          cx="7"
          cy="7"
          r="6.5"
          fill="none"
          stroke="white"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <path
          fill="none"
          stroke="white"
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M5.5 5.5A1.5 1.5 0 1 1 7 7v1"
        />
        <path fill="white" d="M7 9.5a.75.75 0 1 0 .75.75A.76.76 0 0 0 7 9.5Z" />
      </svg>
      <h2
        class="text-3xl font-semibold text-white text-center max-sm:text-2xl"
        style="
          background: linear-gradient(
            to top,
            #ffffff,
            #e9e9e9 40%,
            rgba(250, 250, 250, 0.467) 80%
          );
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          background-clip: text;
        "
      >
        {{ fixedPathTranslate + "TITLE" | translate }}
      </h2>
    </div>

    <ul class="space-y-3 w-full">
      <li
        *ngFor="let item of faqList; let i = index"
        class="faq-item shadow-lg border-2 border-white/10 transition duration-200 cursor-pointer"
        [ngClass]="{
          'ring-2 ring-white/70 bg-gradient-to-br from-[#131313] via-[#111111] to-[#000000] rounded-3xl':
            activeIndex === i,
          'bg-gradient-to-br from-[#080808] via-[#0d0e0f] to-[#010205] rounded-full max-md:rounded-3xl':
            activeIndex !== i
        }"
        style="overflow: hidden"
      >
        <button
          (click)="toggleFaq(i)"
          class="w-full text-left px-6 py-5 flex items-center justify-between focus:outline-none transition hover:bg-gradient-to-r hover:from-[#26282c] hover:to-[#3a3d43] group cursor-pointer"
          [attr.aria-expanded]="activeIndex === i"
        >
          <span class="flex items-center">
            <span
              class="mr-4 text-transparent bg-clip-text bg-gradient-to-r from-gray-200 via-gray-400 to-gray-100 font-bold text-lg drop-shadow"
            >
              Q{{ i + 1 }} :
            </span>
            <span
              class="font-semibold text-lg text-transparent bg-clip-text bg-gradient-to-l from-gray-50 via-gray-200 to-white group-hover:bg-gradient-to-r group-hover:from-gray-200 group-hover:via-blue-400 group-hover:to-gray-100 transition"
            >
              {{ item.question }}
            </span>
          </span>
          <span>
            <svg
              *ngIf="activeIndex !== i"
              xmlns="http://www.w3.org/2000/svg"
              class="h-6 w-6 text-transparent bg-clip-text bg-gradient-to-br from-gray-200 via-gray-500 to-gray-100 transition"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M12 6v12m6-6H6"
              />
            </svg>
            <svg
              *ngIf="activeIndex === i"
              xmlns="http://www.w3.org/2000/svg"
              class="h-6 w-6 text-transparent bg-clip-text bg-gradient-to-br from-gray-200 via-gray-500 to-blue-400 rotate-45 transition"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M12 6v12m6-6H6"
              />
            </svg>
          </span>
        </button>

        <div
          *ngIf="activeIndex === i"
          id="faq-answer-{{ i }}"
          class="faq-answer px-7 pb-6 pt-2"
          style="
            background: linear-gradient(100deg, #131313 60%, #11111188 100%);
          "
        >
          <span
            [innerHTML]="item.answer"
            style="
              color: #f3f4f6;
              font-weight: 500;
              letter-spacing: 0.005em;
              background: linear-gradient(
                90deg,
                #f3f4f6,
                #b1b4b7 40%,
                #b1b4b7 80%
              );
              -webkit-background-clip: text;
              -webkit-text-fill-color: transparent;
              background-clip: text;
              text-fill-color: transparent;
            "
          ></span>
        </div>
      </li>
    </ul>
  </div>
</div>
