<div
  class="photo-animation-section relative min-h-[500px] sm:min-h-[600px] flex flex-col items-center justify-center overflow-hidden bg-black pt-4 pb-8 sm:pt-6 sm:pb-12 max-w-[100vw] overflow-x-hidden w-[100vw]"
  style="background-color: #0e0e0e94"
>
  <!-- Texte d'intro -->
  <section
    class="z-30 text-white text-center flex flex-col items-center justify-center w-full mb-6 sm:mb-10 px-2"
    aria-label="Introduction à la galerie"
  >
    <h2
      class="text-3xl sm:text-4xl md:text-5xl font-extrabold mb-2 sm:mb-3 animate-fade-in bg-gradient-to-r from-gray-600 to-gray-300 bg-clip-text text-transparent drop-shadow-lg"
      style="animation-delay: 0.15s"
    >
      {{ fixedPathTranslate + "TITLE" | translate }}
    </h2>
    <p
      class="text-lg sm:text-2xl font-medium animate-fade-in mb-1 sm:mb-2 text-gray-200"
      style="animation-delay: 0.4s"
    >
      {{ fixedPathTranslate + "SUBTITLE" | translate }}
      <span class="animate-wiggle inline-block" aria-hidden="true">✨</span>
    </p>
    <p
      class="text-base sm:text-lg font-normal animate-fade-in text-gray-400 max-w-xs sm:max-w-xl mx-auto"
      style="animation-delay: 0.7s"
    >
      {{ fixedPathTranslate + "PARAGRAPH_2" | translate }}
    </p>
  </section>

  <div class="max-w-[90%] max-xl:min-w-[95%] max-xl:mx-auto">
    <!-- Affichage d'un seul élément, responsive -->
    <ng-container *ngIf="carouselImages.length > 0">
      <div class="grid grid-cols-4 gap-4 max-xl:grid-cols-2 max-xl:gap-2">
        <div
          *ngFor="let cart of carouselImages; let i = index"
          class="min-h-[400px] rounded-4xl overflow-hidden shadow-md shadow-gray-700/70"
          [attr.aria-label]="'Image 1: ' + carouselImages[i].alt"
          tabindex="0"
        >
          <img
            [src]="carouselImages[i].src"
            [alt]="carouselImages[i].alt"
            class="w-full h-full object-cover select-none pointer-events-none group-hover:scale-105 transition-transform duration-500 ease-in-out"
            loading="lazy"
            draggable="false"
          />

          <div class="absolute top-2 right-2 sm:top-3 sm:right-3">
            <span
              class="inline-block rounded-full bg-primary px-1.5 py-0.5 sm:px-2 sm:py-1 text-[11px] sm:text-xs font-bold text-white drop-shadow animate-fade-in"
              style="animation-delay: 0.1s"
            >
              #{{ i + 1 }}
            </span>
          </div>
        </div>
      </div>
    </ng-container>
  </div>
</div>
