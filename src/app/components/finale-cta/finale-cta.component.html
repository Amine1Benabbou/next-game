<div    style="background-color: #0e0e0e94;">
  <section
  class="py-16 rounded-t-[100px] border-gray-50/10 border-b-1"
  style="
    background-image: linear-gradient(to top, #000000 0%, rgb(0, 0, 0) 100%);
  "
>
  <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
    <div class="space-y-6">
      <h2
        class="title-1 text-4xl md:text-5xl font-heading font-bold text-white"
        [ngClass]="{ 'title-1-annimation': annimationLaunch }"
      >
        {{ fixedPathTranslate + "TITLE" | translate }}
      </h2>
      <p
        class="title-2 text-xl text-white/90"
        [ngClass]="{ 'title-2-annimation': annimationLaunch }"
      >
        {{ fixedPathTranslate + "SUBTITLE" | translate }}
      </p>

      <div
        class="flex flex-col sm:flex-row gap-4 justify-center items-center mt-8"
        [ngClass]="{ 'buttons-annimation': annimationLaunch }"
      >
        <!-- Bouton principal -->
        <a
          [routerLink]="['/main-page/auth']"
          (click)="commonFunctionService.scrollToElement('account-choice-id')"
          class="button-1 px-6 py-3 text-lg font-semibold rounded-full border-2 border-primary bg-white text-primary transition-all duration-300 transform hover:scale-105 hover:bg-primary hover:text-black hover:shadow-lg cursor-pointer"
        >
          {{ fixedPathTranslate + "BUTTON_1" | translate }}
        </a>
      </div>
    </div>
  </div>
</section>

</div>
